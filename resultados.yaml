# resultados.yaml — aquí van TUS mediciones, no las de nadie más.
# null = no medido. Deja el null si no lo has medido: un hueco no es un cero,
# y tampoco es un aprobado.

gpt-6-astra:
  fluida: 0.14            # 1 nivel completado de los 7 de ls20
  # Medido: 1 nivel con harness persistente, 0 sin él. Caída relativa = 1.0
  andamiaje: 1.0          # (persistente - amnesico) / persistente
  # Sesión 1: "inventario__revisado__030" (correcto). Sesión 2 limpia: no lo conoce.
  memoria: false          # true si retiene en sesión limpia, false si no
  horizonte: null         # horas al 80% de fiabilidad
  coherencia: null        # mínimo entre los anteriores, normalizado 0-1

claude-fable-5-1:
  # Las pruebas de ARC con este modelo no se han pagado: quedan como SIN MEDIR.
  # Un hueco no es un cero. El script lo imprime en gris, no en rojo.
  fluida: null
  andamiaje: null
  memoria: null
  horizonte: null
  coherencia: null

azar:
  fluida: null            # la línea base. Si el modelo no la supera, no hay debate.
  andamiaje: null
  memoria: false
  horizonte: 0
  coherencia: 0